<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<title>Promethee Card Studio</title>
<style>
:root{--panel:#141110;--line:#2a2522;--cream:#f4eadf;--dim:#9a8f86;--orange:#e1633a;}
*{box-sizing:border-box;}
body{margin:0;background:#070605;color:var(--cream);font-family:'DMSans',system-ui,sans-serif;display:flex;gap:22px;padding:22px;height:100vh;overflow:hidden;}
.panel{width:360px;flex:0 0 360px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;overflow:auto;}
h1{font-size:16px;margin:0 0 2px;letter-spacing:.5px;}
.v{font-size:12px;color:var(--dim);margin:0 0 14px;font-family:'DMMono',monospace;}
label{display:block;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);margin:14px 0 5px;font-family:'DMMono',monospace;}
input,select,textarea{width:100%;background:#0c0a09;border:1px solid var(--line);border-radius:9px;color:var(--cream);padding:9px 11px;font-size:13.5px;font-family:'DMSans',sans-serif;}
textarea{resize:vertical;min-height:90px;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange);}
.row{display:flex;gap:10px;}.row>div{flex:1;}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--dim);}
.chk input{width:auto;}
button.ghost{margin-top:8px;background:transparent;color:var(--orange);border:1px solid var(--orange);padding:9px;font-size:12.5px;}
.follow{transition:opacity .9s ease;display:flex;align-items:center;gap:14px;font-size:12px;color:var(--dim);line-height:1.5;}

.stats[hidden]{display:none;}
.stats{margin-top:18px;border-top:1px solid #2a211c;padding-top:16px;}
.stats h2{margin:0 0 10px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-family:'DMMono',monospace;font-weight:500;}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.tile{background:#0c0a09;border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
.tile .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-family:'DMMono',monospace;}
.tile .v{margin-top:4px;font-size:19px;color:var(--cream);font-family:'DMSans',sans-serif;font-weight:700;}
.tile .s{margin-top:2px;font-size:11px;color:var(--dim);font-family:'DMMono',monospace;}
.up{color:#7bd88f}.down{color:#e07a6a}
.bars{display:flex;align-items:flex-end;gap:5px;height:84px;margin-top:12px;}
.bars .b{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;}
.bars .b i{display:block;width:100%;min-height:2px;background:var(--orange);border-radius:3px 3px 0 0;opacity:.85;}
.bars .b span{font-size:9.5px;color:var(--dim);font-family:'DMMono',monospace;}
.bars .b.today i{opacity:1;}
.cmp{margin-top:18px;}
.cmp .bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.cmp .tab{margin:0;width:auto;padding:6px 12px;font-size:12px;background:transparent;color:var(--dim);border:1px solid var(--line);}
.cmp .tab.on{color:var(--cream);border-color:var(--orange);}
.cmp .refresh{margin:0 0 0 auto;width:auto;padding:6px 10px;font-size:12px;background:transparent;color:var(--dim);border:1px solid var(--line);}
.row2{display:grid;grid-template-columns:22px minmax(90px,200px) 1fr 74px;align-items:center;gap:10px;padding:4px 0;font-size:12.5px;color:var(--cream);font-family:'DMSans',sans-serif;}
.row2 .n{color:var(--dim);font-family:'DMMono',monospace;font-size:11px;}
.row2 .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row2 .tr{height:8px;background:#1a1512;border-radius:4px;overflow:hidden;}
.row2 .tr i{display:block;height:100%;background:#6b5a4d;border-radius:4px;}
.row2 .t{text-align:right;color:var(--dim);font-family:'DMMono',monospace;font-size:11.5px;}
.row2.me .nm{color:var(--orange);font-weight:700;}
.row2.me .tr i{background:var(--orange);}
.cmp .note{margin-top:6px;font-size:11px;color:var(--dim);font-family:'DMMono',monospace;}
.follow[hidden]{display:none;}
.follow.fade{opacity:0;}
.follow button.ghost{margin-top:0;width:auto;padding:8px 14px;white-space:nowrap;}
button{margin-top:16px;width:100%;background:var(--orange);color:#1a0d08;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:'DMSans',sans-serif;}
button:disabled{opacity:.5;cursor:default;}
.status{margin-top:12px;font-size:12px;color:var(--dim);font-family:'DMMono',monospace;line-height:1.6;white-space:pre-wrap;}
.stage{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px;}
.cw{width:100%;background:#000;border:1px solid var(--line);border-radius:12px;overflow:hidden;line-height:0;}
canvas{width:100%;height:auto;display:block;}
a{color:var(--orange);word-break:break-all;}
.cw{position:relative;}
#scene{position:absolute;left:0;top:0;width:1920px;height:1024px;border:0;transform-origin:0 0;pointer-events:none;}
.cw.is-scene{aspect-ratio:1920/1024;}
.cw.is-scene canvas{visibility:hidden;}
</style>
</head>
<body>
<div class="panel">
  <h1>Card Studio</h1>
  <p class="v" id="appv">Loading…</p>

  <label>Session</label>
  <select id="sessionSel"></select>
  <div class="status" id="poststate" style="margin-top:8px;"></div>

  <label>Handle</label>
  <input id="handle" value="@zaros"/>

  <label>Card style</label>
  <select id="cardStyle">
    <option value="classic">Classic</option>
    <option value="center">Center (big time, rank as background)</option>
    <option value="companion">Companion (taskbar)</option>
  </select>

  <label>League</label>
  <select id="tier"></select>
  <div class="row">
    <div><label>Rank</label><input id="rank" type="number" value="1"/></div>
    <div><label>Streak (days)</label><input id="streak" type="number" value="0"/></div>
  </div>
  <div class="row">
    <div><label>Places gained</label><input id="places" type="number" value="0"/></div>
    <div><label>FR gained</label><input id="fr" type="number" value="0"/></div>
  </div>

  <label>Post text</label>
  <textarea id="body" placeholder="Write the text of your session post…"></textarea>

  <div class="chk"><input type="checkbox" id="hidden" checked/><label for="hidden" style="margin:0;text-transform:none;letter-spacing:0;font-family:'DMSans';font-size:12.5px;">Publish hidden (test, invisible to others)</label></div>

  <button id="publish" disabled>Publish session</button>
  <div class="status" id="status"></div>

</div>

<div class="stage">
  <div class="cw" id="cw"><canvas id="cv" width="1920" height="1024"></canvas><iframe id="scene" title="Companion variant preview" hidden></iframe></div>
  <div class="status" id="hint">Live animated preview. The final WebP is generated when you publish.</div>
  <div class="follow" id="followBox" hidden>
    <span id="followText">Enjoying Card Studio? Follow the author on Promethee.</span>
    <button id="followBtn" class="ghost" type="button">Follow @zaros</button>
  </div>
  <section class="stats" id="stats" hidden>
    <h2>Your stats</h2>
    <div class="tiles" id="tiles"></div>
    <div class="bars" id="bars"></div>
    <div class="cmp">
      <h2>Compare (last 7 days)</h2>
      <div class="bar">
        <button class="tab on" id="tabLeague" type="button">League neighbours</button>
        <button class="tab" id="tabFollowing" type="button">People I follow</button>
        <button class="refresh" id="cmpRefresh" type="button">Refresh</button>
      </div>
      <div id="cmpList"></div>
      <div class="note" id="cmpNote"></div>
    </div>
  </section>
</div>

<script src="card.js"></script>
<script src="renderer.js"></script>
</body>
</html>
