<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<title>Promethee Card Studio</title>
<style>
:root{--panel:#141110;--line:#2a2522;--cream:#f4eadf;--dim:#9a8f86;--orange:#e1633a;}
*{box-sizing:border-box;}
body{margin:0;background:#070605;color:var(--cream);font-family:'DMSans',system-ui,sans-serif;display:flex;gap:22px;padding:22px;height:100vh;overflow:hidden;}
.panel{width:360px;flex:0 0 360px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;overflow:auto;}
h1{font-size:16px;margin:0 0 2px;letter-spacing:.5px;}
.v{font-size:12px;color:var(--dim);margin:0 0 14px;font-family:'DMMono',monospace;}
label{display:block;font-size:10.5px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);margin:14px 0 5px;font-family:'DMMono',monospace;}
input,select,textarea{width:100%;background:#0c0a09;border:1px solid var(--line);border-radius:9px;color:var(--cream);padding:9px 11px;font-size:13.5px;font-family:'DMSans',sans-serif;}
textarea{resize:vertical;min-height:150px;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--orange);}
.row{display:flex;gap:10px;}.row>div{flex:1;}
.sess{background:#0c0a09;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:12px;font-family:'DMMono',monospace;color:var(--dim);line-height:1.7;}
.sess b{color:var(--cream);font-weight:400;}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12.5px;color:var(--dim);}
.chk input{width:auto;}
button{margin-top:16px;width:100%;background:var(--orange);color:#1a0d08;border:none;border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;font-family:'DMSans',sans-serif;}
button:disabled{opacity:.5;cursor:default;}
.status{margin-top:12px;font-size:12px;color:var(--dim);font-family:'DMMono',monospace;line-height:1.6;white-space:pre-wrap;}
.stage{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;}
.cw{width:100%;background:#000;border:1px solid var(--line);border-radius:12px;overflow:hidden;line-height:0;}
canvas{width:100%;height:auto;display:block;}
a{color:var(--orange);word-break:break-all;}
/* live in-progress session tracker */
.live{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 26px;}
.live.off{opacity:.55;}
.live-head{display:flex;align-items:center;gap:11px;font-family:'DMMono',monospace;font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);margin-bottom:20px;}
.live-dot{width:9px;height:9px;border-radius:50%;background:#3a3330;flex:0 0 auto;}
.live.on .live-dot{background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.6);animation:lp 2s infinite;}
.live.paused .live-dot{background:#e1a33a;animation:none;}
@keyframes lp{0%{box-shadow:0 0 0 0 rgba(74,222,128,.5);}70%{box-shadow:0 0 0 6px rgba(74,222,128,0);}100%{box-shadow:0 0 0 0 rgba(74,222,128,0);}}
.live-head .meta{margin-left:auto;color:var(--dim);letter-spacing:.5px;text-transform:none;font-size:12.5px;}
.live-stats{display:flex;gap:40px;align-items:flex-end;}
.stat .n{font-family:'PrometheeCondensed','DMSans',sans-serif;font-size:58px;line-height:.9;color:var(--cream);}
.stat .n.warn{color:var(--orange);}
.stat .k{font-family:'DMMono',monospace;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-top:9px;}
.live-apps{margin-left:auto;text-align:right;font-family:'DMMono',monospace;font-size:12.5px;color:var(--dim);line-height:1.9;max-width:46%;}
.live-apps b{color:#c8bcb1;font-weight:400;}
.grace{margin-top:18px;border-radius:10px;padding:12px 15px;font-size:13.5px;font-family:'DMSans',sans-serif;display:none;}
.grace.show{display:block;background:rgba(225,99,58,.12);border:1px solid rgba(225,99,58,.4);color:#f0a98f;}
.grace b{color:var(--orange);}
.live-empty{font-size:12.5px;color:var(--dim);}
.live-tip{margin-top:14px;font-size:13px;color:#9a8f86;font-family:'DMSans',sans-serif;line-height:1.55;display:none;}
.live-tip.show{display:block;}
.live-tip b{color:#c8bcb1;font-weight:600;}
.live-tip.good b{color:#4ade80;}
</style>
</head>
<body>
<div class="panel">
  <h1>Card Studio</h1>
  <p class="v" id="appv">Chargement…</p>

  <label>Session</label>
  <select id="sessionSel"></select>
  <div class="sess" id="sessbox" style="margin-top:10px;">…</div>
  <div class="status" id="poststate" style="margin-top:6px;"></div>

  <label>Pseudo</label>
  <input id="handle" value="@zaros"/>

  <label>Tier</label>
  <select id="tier"></select>
  <div class="row">
    <div><label>Rang</label><input id="rank" type="number" value="1"/></div>
    <div><label>Streak (jours)</label><input id="streak" type="number" value="0"/></div>
  </div>
  <div class="row">
    <div><label>Places gagnees</label><input id="places" type="number" value="0"/></div>
    <div><label>FR gagnes</label><input id="fr" type="number" value="0"/></div>
  </div>

  <label>Texte du post</label>
  <textarea id="body" placeholder="Ecris le texte de ton post de session…"></textarea>

  <div class="chk"><input type="checkbox" id="hidden" checked/><label for="hidden" style="margin:0;text-transform:none;letter-spacing:0;font-family:'DMSans';font-size:12.5px;">Publier en cache (test, invisible pour les autres)</label></div>

  <button id="publish" disabled>Publier la session</button>
  <div class="status" id="status"></div>
</div>

<div class="stage">
  <div class="live off" id="live">
    <div class="live-head">
      <span class="live-dot"></span>
      <span id="liveTitle">Session en cours</span>
      <span class="meta" id="liveMeta"></span>
    </div>
    <div id="liveBody">
      <div class="live-empty" id="liveEmpty">Aucune session en cours. Lance une session dans Promethee, le compteur demarre tout seul.</div>
      <div class="live-stats" id="liveStats" style="display:none;">
        <div class="stat"><div class="n" id="liveSwitch">0</div><div class="k">switch penalisants</div></div>
        <div class="stat"><div class="n" id="liveFocus">100</div><div class="k">focus (hors idle)</div></div>
        <div class="stat"><div class="n" id="livePenalty">0</div><div class="k">malus switch (pts)</div></div>
        <div class="live-apps" id="liveApps"></div>
      </div>
      <div class="grace" id="liveGrace"></div>
      <div class="live-tip" id="liveTip"></div>
    </div>
  </div>
  <div class="cw"><canvas id="cv" width="1920" height="1024"></canvas></div>
  <div class="status" id="hint">Apercu anime en direct. Le rendu final (WebP) est genere au moment de publier.</div>
</div>

<script src="card.js"></script>
<script src="renderer.js"></script>
</body>
</html>
